name: Release VS Code extension

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  build:
    name: Build VSIX artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Distrust compromised eMudhra CA roots
        # Temporary until GitHub-hosted runner images ship the fixed ca-certificates
        # package (actions/runner-images#15018). Debian's fixed package disables the same roots.
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh >/dev/null
          # PEM lines unique to emSign ECC Root CA - G3 and AAA Certificate Services.
          for needle in RzMwHhcNMTgwMjE4MTgzMDAwWhcNNDMwMjE4MTgzMDAwWjBrMQswCQYDVQQGEwJJ YXRlIFNlcnZpY2VzMB4XDTA0MDEwMTAwMDAwMFoXDTI4MTIzMTIzNTk1OVowezEL; do
            if grep -qF "$needle" /etc/ssl/certs/ca-certificates.crt; then
              echo "A compromised eMudhra root is still trusted" >&2
              exit 1
            fi
          done

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: "2026.10.18"
          install_args: --locked
          cache: false

      - name: Validate release commit
        id: release
        run: node ./scripts/ci-publish-checks.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check
        run: hk check --all --check

      - name: Build release artifacts
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.expected_digest }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          release_dir="$RUNNER_TEMP/vsix-release"
          export RELEASE_NPM_PATH
          RELEASE_NPM_PATH=$(mise which npm)
          pnpm exec node scripts/build-release.ts \
            "${GITHUB_REF_NAME#v}" \
            "$release_dir"
          actual_digest=$(shasum -a 256 "$release_dir/release-manifest.sha256" | awk '{print $1}')
          if [[ $actual_digest != "$EXPECTED_DIGEST" ]]; then
            echo "release manifest digest $actual_digest does not match signed digest $EXPECTED_DIGEST" >&2
            exit 1
          fi

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vsix-release/*.vsix
            ${{ runner.temp }}/vsix-release/release-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      attestations: write # Required to persist VSIX artifact attestations.
      contents: write # Required to create the GitHub release.
      id-token: write # Required for artifact attestation signing.
    steps:
      - name: Distrust compromised eMudhra CA roots
        # Temporary until GitHub-hosted runner images ship the fixed ca-certificates
        # package (actions/runner-images#15018). Debian's fixed package disables the same roots.
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh >/dev/null
          # PEM lines unique to emSign ECC Root CA - G3 and AAA Certificate Services.
          for needle in RzMwHhcNMTgwMjE4MTgzMDAwWhcNNDMwMjE4MTgzMDAwWjBrMQswCQYDVQQGEwJJ YXRlIFNlcnZpY2VzMB4XDTA0MDEwMTAwMDAwMFoXDTI4MTIzMTIzNTk1OVowezEL; do
            if grep -qF "$needle" /etc/ssl/certs/ca-certificates.crt; then
              echo "A compromised eMudhra root is still trusted" >&2
              exit 1
            fi
          done

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts

      - name: Revalidate release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version=${GITHUB_REF_NAME#v}
          extension_version=${release_version%%-*}
          prerelease=false
          if [[ $release_version == *-* ]]; then
            prerelease=true
          fi

          tag_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.type)
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.sha)
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)
          if [[ $tag_type != commit || $tag_sha != "$GITHUB_SHA" ]]; then
            echo "release tag $GITHUB_REF_NAME no longer points to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$main_sha" \
            --jq .status)
          if [[ $comparison != identical && $comparison != ahead ]]; then
            echo "release commit $tag_sha is no longer an ancestor of main" >&2
            exit 1
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$tag_sha")
          verified=$(jq -r .verification.verified <<< "$commit")
          message=$(jq -r .message <<< "$commit")
          subject=${message%%$'\n'*}
          expected_digest=$(sed -n 's/^Release-Manifest-SHA256: //p' <<< "$message")
          if [[ $verified != true || $subject != "release: $GITHUB_REF_NAME" ]]; then
            echo "GitHub does not recognize the expected signed release commit" >&2
            exit 1
          fi
          if [[ ! $expected_digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "release commit is missing a valid Release-Manifest-SHA256 trailer" >&2
            exit 1
          fi

          cd release-artifacts
          expected_files=$(printf '%s\n' \
            "release-manifest.sha256" \
            "vscode-node-test-explorer-$extension_version-alpine-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-alpine-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-darwin-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-darwin-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-linux-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-linux-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-win32-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-win32-x64.vsix")
          actual_files=$(find . -maxdepth 1 -type f -print | sed 's|^\./||' | LC_ALL=C sort)
          if [[ $actual_files != "$expected_files" ]]; then
            echo "release artifact contains unexpected files" >&2
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi
          actual_digest=$(shasum -a 256 release-manifest.sha256 | awk '{print $1}')
          if [[ $actual_digest != "$expected_digest" ]]; then
            echo "release manifest digest $actual_digest does not match signed digest $expected_digest" >&2
            exit 1
          fi
          manifest_files=$(awk '{print $2}' release-manifest.sha256 | LC_ALL=C sort)
          if [[ $manifest_files != "${expected_files#*$'\n'}" ]]; then
            echo "release manifest does not contain the exact expected VSIX files" >&2
            exit 1
          fi
          shasum -a 256 -c release-manifest.sha256

          for vsix in *.vsix; do
            unzip -p "$vsix" extension/package.json |
              jq -e \
                --arg version "$extension_version" \
                '.name == "vscode-node-test-explorer" and
                 .publisher == "2h2d" and
                 .version == $version' >/dev/null
            vsix_manifest=$(unzip -p "$vsix" extension.vsixmanifest)
            if [[ $prerelease == true ]]; then
              grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' \
                <<< "$vsix_manifest"
            elif grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' \
              <<< "$vsix_manifest"; then
              echo "stable release contains a prerelease VSIX: $vsix" >&2
              exit 1
            fi
          done

      - name: Attest VSIX artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.vsix
            release-artifacts/release-manifest.sha256

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            release-artifacts/*.vsix
            release-artifacts/release-manifest.sha256
            --repo "$GITHUB_REPOSITORY"
            --generate-notes
            --verify-tag
          )
          if [[ $PRERELEASE == true ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

  marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - name: Distrust compromised eMudhra CA roots
        # Temporary until GitHub-hosted runner images ship the fixed ca-certificates
        # package (actions/runner-images#15018). Debian's fixed package disables the same roots.
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh >/dev/null
          # PEM lines unique to emSign ECC Root CA - G3 and AAA Certificate Services.
          for needle in RzMwHhcNMTgwMjE4MTgzMDAwWhcNNDMwMjE4MTgzMDAwWjBrMQswCQYDVQQGEwJJ YXRlIFNlcnZpY2VzMB4XDTA0MDEwMTAwMDAwMFoXDTI4MTIzMTIzNTk1OVowezEL; do
            if grep -qF "$needle" /etc/ssl/certs/ca-certificates.crt; then
              echo "A compromised eMudhra root is still trusted" >&2
              exit 1
            fi
          done

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts

      - name: Revalidate release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version=${GITHUB_REF_NAME#v}
          extension_version=${release_version%%-*}
          prerelease=false
          if [[ $release_version == *-* ]]; then
            prerelease=true
          fi

          tag_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.type)
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.sha)
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)
          if [[ $tag_type != commit || $tag_sha != "$GITHUB_SHA" ]]; then
            echo "release tag $GITHUB_REF_NAME no longer points to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$main_sha" \
            --jq .status)
          if [[ $comparison != identical && $comparison != ahead ]]; then
            echo "release commit $tag_sha is no longer an ancestor of main" >&2
            exit 1
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$tag_sha")
          verified=$(jq -r .verification.verified <<< "$commit")
          message=$(jq -r .message <<< "$commit")
          subject=${message%%$'\n'*}
          expected_digest=$(sed -n 's/^Release-Manifest-SHA256: //p' <<< "$message")
          if [[ $verified != true || $subject != "release: $GITHUB_REF_NAME" ]]; then
            echo "GitHub does not recognize the expected signed release commit" >&2
            exit 1
          fi
          if [[ ! $expected_digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "release commit is missing a valid Release-Manifest-SHA256 trailer" >&2
            exit 1
          fi

          cd release-artifacts
          expected_files=$(printf '%s\n' \
            "release-manifest.sha256" \
            "vscode-node-test-explorer-$extension_version-alpine-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-alpine-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-darwin-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-darwin-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-linux-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-linux-x64.vsix" \
            "vscode-node-test-explorer-$extension_version-win32-arm64.vsix" \
            "vscode-node-test-explorer-$extension_version-win32-x64.vsix")
          actual_files=$(find . -maxdepth 1 -type f -print | sed 's|^\./||' | LC_ALL=C sort)
          if [[ $actual_files != "$expected_files" ]]; then
            echo "release artifact contains unexpected files" >&2
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi
          actual_digest=$(shasum -a 256 release-manifest.sha256 | awk '{print $1}')
          if [[ $actual_digest != "$expected_digest" ]]; then
            echo "release manifest digest $actual_digest does not match signed digest $expected_digest" >&2
            exit 1
          fi
          manifest_files=$(awk '{print $2}' release-manifest.sha256 | LC_ALL=C sort)
          if [[ $manifest_files != "${expected_files#*$'\n'}" ]]; then
            echo "release manifest does not contain the exact expected VSIX files" >&2
            exit 1
          fi
          shasum -a 256 -c release-manifest.sha256

          for vsix in *.vsix; do
            unzip -p "$vsix" extension/package.json |
              jq -e \
                --arg version "$extension_version" \
                '.name == "vscode-node-test-explorer" and
                 .publisher == "2h2d" and
                 .version == $version' >/dev/null
            vsix_manifest=$(unzip -p "$vsix" extension.vsixmanifest)
            if [[ $prerelease == true ]]; then
              grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' \
                <<< "$vsix_manifest"
            elif grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' \
              <<< "$vsix_manifest"; then
              echo "stable release contains a prerelease VSIX: $vsix" >&2
              exit 1
            fi
          done

      - name: Check out publishing client lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publishing-client
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Install locked publishing client
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          test "$(npm --version)" = 10.9.9
          corepack enable pnpm
          test "$(corepack pnpm@12.16.0 --version)" = 12.16.0
          corepack pnpm@12.16.0 --dir publishing-client install --frozen-lockfile --ignore-scripts
          test "$(corepack pnpm@12.16.0 --dir publishing-client exec vsce --version)" = 4.0.0

      - name: Publish verified VSIX artifacts
        shell: bash
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          args=(publish --skip-duplicate)
          if [[ $PRERELEASE == true ]]; then
            args+=(--pre-release)
          fi
          vsix_files=("$GITHUB_WORKSPACE"/release-artifacts/*.vsix)
          if (( ${#vsix_files[@]} != 8 )); then
            echo "expected 8 verified VSIX files, found ${#vsix_files[@]}" >&2
            exit 1
          fi
          args+=(--packagePath "${vsix_files[@]}")
          corepack pnpm@12.16.0 --dir publishing-client exec vsce "${args[@]}"
