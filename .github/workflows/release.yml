name: Release VS Code extension

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish extension
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: write # Required to create the GitHub release.
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: --locked
          cache: false
      - name: Validate release
        run: node ./scripts/ci-publish-checks.ts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Package VSIX artifacts
        run: pnpm package:all
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" artifacts/vsix/*.vsix --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to VS Code Marketplace
        run: |
          args=(publish --skip-duplicate)
          if [[ $(node -p 'require("./package.json").version.includes("-")') == true ]]; then
            args+=(--pre-release)
          fi
          args+=(--packagePath artifacts/vsix/*.vsix)
          pnpm exec vsce "${args[@]}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
