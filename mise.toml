[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "2.8.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
jactionlint = "2.3.0"
zizmor = "1.30.1"
node = "22.23.4"
npm = "11.21.0"
pnpm = "12.15.0"

[tasks.check]
description = "Run all non-writing project checks"
run = ["hk check --all --check", "pnpm test", "pnpm audit"]

[tasks.init]
description = "Install locked dependencies and Git hooks"
run = ["pnpm install --frozen-lockfile --ignore-scripts", "hk install --mise"]
