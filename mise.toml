[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "1.54.1", postinstall = "hk install --mise" }
betterleaks = "1.7.3"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"
node = "22.23.2"
npm = "11.19.0"
pnpm = "11.20.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
