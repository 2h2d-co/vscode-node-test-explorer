[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "1.54.1", postinstall = "hk install --mise" }
betterleaks = "latest"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.28.0"
node = "22.23.1"
pnpm = "11.13.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
