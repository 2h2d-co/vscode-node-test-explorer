allowBuilds:
  "@vscode/vsce-sign": false

minimumReleaseAge: 10080
overrides:
  # @azure/identity 4.14.0, the latest release, depends on @azure/msal-node ^6.0.0, and every
  # 6.x release has GHSA-xcx6-jx8p-x3h5 (fixed in 7.1.0). Drop this once @azure/identity
  # depends on a fixed @azure/msal-node.
  "@azure/msal-node": 7.1.0
minimumReleaseAgeExclude:
  - "@2h2d/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
